# Runs ShellCheck (a linter that catches bash mistakes) on every push and
# pull request. If it finds anything, the check goes red on GitHub.
name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read   # it only needs to read the code

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck franken-scan.sh
      - name: Syntax and portability regressions
        run: |
          bash -n franken-scan.sh
          bash tests/portability.sh
          bash tests/detection.sh
      - name: Smoke test with explicit exit handling
        shell: bash
        run: |
          set +e
          timeout 60 bash franken-scan.sh --no-color --quiet > scan.txt 2>&1
          status=$?
          set -e
          cat scan.txt
          test "$status" -eq 0 || test "$status" -eq 1
          grep -q '── Result ──' scan.txt
          grep -q 'Grade [ABCDF]' scan.txt
          ! grep -Eq 'command not found|unbound variable|syntax error' scan.txt
