# Runs ShellCheck (a linter that catches bash mistakes) on every push and
# pull request. If it finds anything, the check goes red on GitHub.
name: ShellCheck

on:
  push:
  pull_request:

permissions:
  contents: read   # it only needs to read the code

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck franken-scan.sh
      - name: Quick smoke test (it should run without crashing)
        run: bash franken-scan.sh --no-color --quiet || true
